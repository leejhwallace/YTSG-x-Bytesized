 <html lang="en">

        <title>Forgot Password</title>

    <body>
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
        <div class="circle circle3"></div>
        <main>
            <section class="left-panel" aria-labelledby="page-title">
                <p id="page-title" class="forgot-password-title">Forget Password</p>
                <p class="personal-info">Enter your <b>Email</b> to reset it</p>
                
                <form class="form-container" id="forgot-password-form">
                    <label class="input-group">
                        <!-- Custom CSS SVG Email Icon placeholder -->
                        <span class="custom-email-icon"></span>
                        <input type="email" name="email" placeholder="Email" autocomplete="email" required id="Forgot_pass_email">
                    </label>
                    <button type="submit" id="reset-submit-button" class="reset-rounded-button">SIGN UP</button>
                    <p class="reset-message" id="reset-message" aria-live="polite"></p>
                </form>
            </section>
            
            <div class="or-wrapper" aria-hidden="true">
                <div class="or-line"></div>
                <div class="or-for-line">OR</div>
                <div class="or-line"></div>
            </div>
            
            <section class="right-panel">
                <p class="have-account">Remembered your password?</p>
                <!-- FIX: Corrected path from '../Page 1/Get Started.html' to '../page1/Get_Started.html' -->
                <button id="sign-in-button" class="sign-in-rounded-button" onclick="window.location.href='../page1/Get_Started.html';">SIGN IN</button>
            </section>
        </main>
    </body>
