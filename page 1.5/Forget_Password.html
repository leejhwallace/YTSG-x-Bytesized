<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="Forgot_password.css">
        <script src="Forgot_Password.js" defer></script>
        <title>Forgot Password</title>
    </head>
    <body>
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
        <div class="circle circle3"></div>

        <main>
            <section class="left-panel" aria-labelledby="page-title">
                <p id="page-title" class="forgot-password-title">Forgot Password</p>
                <p class="personal-info">Enter your <b>Email</b> to reset it</p>

                <form class="form-container" id="forgot-password-form">
                    <label class="input-group">
                        <img class="email-icon" src="https://cdn-icons-png.flaticon.com/512/561/561127.png" alt="">
                        <input type="email" name="email" placeholder="Email" autocomplete="email" required id="Forgot_pass_email">
                    </label>

                    <button type="submit" class="reset-rounded-button">RESET</button>
                    <p class="reset-message" id="reset-message" aria-live="polite"></p>
                </form>
            </section>

            <div class="or-wrapper" aria-hidden="true">
                <div class="or-line"></div>
                <div class="or-for-line">OR</div>
                <div class="or-line"></div>
            </div>

            <section class="right-panel">
                <p class="have-account">Remembered your password?</p>
                <button id="sign-in-button" class="sign-in-rounded-button" onclick="window.location.href='../Page 1/Get Started.html';">SIGN IN</button>
            </section>
        </main>
    </body>
</html>
