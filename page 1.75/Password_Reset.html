<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="Password_Reset.css">
    <!-- Add Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
    <!-- Set Supabase Credentials -->
    <script>
        window.SUPABASE_URL = "https://txfditoxxdjigplckjcc.supabase.co";
        window.SUPABASE_ANON_KEY = "sb_publishable_KzdZhuiEyoG6GEVEggJVug_1VtHc6mz";
    </script>
    <script src="Password_Reset.js" defer></script>
    <link rel="icon" type="image/png" href="../images/web-icon-modified.png">
</head>
<body>
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>
    <main>
        <section class="left-panel" aria-labelledby="page-title">
            <h1 id="page-title" class="reset-password-title">Reset Password</h1>
            <p class="personal-info">Enter your <b>New Password</b> to reset it</p>
            
            <form class="form-container" id="reset-password-form">
                <div class="field-group">
                    <label class="input-group">
                        <span class="custom-lock-icon"></span>
                        <input type="password" id="newPassword" placeholder="Enter New Password" required autocomplete="new-password">
                        <button type="button" class="show-pw" onclick="togglePw('newPassword', this)">
                            <span class="custom-eye-icon"></span>
                        </button>
                    </label>
                </div>

                <div class="field-group">
                    <label class="input-group">
                        <span class="custom-lock-icon"></span>
                        <input type="password" id="confirmPassword" placeholder="Confirm New Password" required autocomplete="new-password">
                        <button type="button" class="show-pw" onclick="togglePw('confirmPassword', this)">
                            <span class="custom-eye-icon"></span>
                        </button>
                    </label>
                </div>

                <button type="submit" id="submit-button" class="reset-rounded-button">CHANGE PASSWORD</button>
                <p class="status-message" id="status-message" aria-live="polite"></p>
            </form>
        </section>
    </main>
</body>
</html>
