<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule</title>
    <script src="Schedule.js"></script>
    <link rel="stylesheet" href="Schedule.css">
</head>

<body>
    <main class="schedule-page">
        <header class="top-bar">
            <a href="../page3/Dashboard.html" class="back-button" aria-label="Back to dashboard"></a>
            <h1>Schedule</h1>
        </header>

        <section class="toolbar" aria-label="Schedule controls">
            <div class="month-picker">
                <button class="month-arrow month-prev" aria-label="Previous month"></button>
                <span id="monthLabel">Loading...</span>
                <button class="month-arrow month-next" aria-label="Next month"></button>
            </div>

            <label class="search-box">
                <span class="search-icon" aria-hidden="true"></span>
                <input type="search" aria-label="Search event or project">
            </label>
        </section>

        <section class="calendar" aria-label="Schedule calendar">
            <div class="calendar-scroll-container">
                <div class="day-strip"></div>
                <div class="calendar-grid" aria-label="Calendar events and projects">
                    <div class="calendar-content"></div>
                </div>
            </div>
        </section>

        <section class="editor-sheet" aria-hidden="true">
            <div class="editor-header">
                <button class="editor-close" aria-label="Close editor">×</button>
                <div class="editor-tabs" role="tablist">
                    <button class="editor-tab active" type="button" data-type="event" role="tab"
                        aria-selected="true">Event</button>
                    <button class="editor-tab" type="button" data-type="project" role="tab"
                        aria-selected="false">Project</button>
                </div>
                <button class="editor-save" aria-label="Save item">✓</button>
            </div>
            <div class="editor-content">
                <div class="editor-column editor-event">
                    <div class="editor-column-title">Event</div>
                    <div class="editor-row">
                        <div class="editor-col">
                            <label class="editor-field">
                                <span>Event Name</span>
                                <input type="text" data-field="name">
                            </label>
                            <label class="editor-field">
                                <span>Date</span>
                                <input type="date" data-field="date">
                            </label>
                            <label class="editor-field">
                                <span>Location</span>
                                <input type="text" data-field="location">
                            </label>
                        </div>
                        <div class="editor-col">
                            <label class="editor-field">
                                <span>Event Description</span>
                                <input type="text" data-field="description">
                            </label>
                            <label class="editor-field">
                                <span>Number of Attendees</span>
                                <input type="number" data-field="attendees">
                            </label>
                            <label class="editor-field">
                                <span>Event Category</span>
                                <input type="text" data-field="category">
                            </label>
                        </div>
                    </div>
                    <label class="editor-field editor-full">
                        <span>Additional Notes</span>
                        <input type="text" data-field="notes">
                    </label>
                </div>
                <div class="editor-column editor-project">
                    <div class="editor-column-title">Project</div>
                    <div class="editor-row">
                        <div class="editor-col">
                            <label class="editor-field">
                                <span>Project Name</span>
                                <input type="text" data-field="name">
                            </label>
                            <label class="editor-field">
                                <span>Date Start</span>
                                <input type="date" data-field="startDate">
                            </label>
                            <label class="editor-field">
                                <span>Project Lead</span>
                                <input type="text" data-field="lead">
                            </label>
                            <label class="editor-field">
                                <span>Task Status</span>
                                <input type="text" data-field="status">
                            </label>
                        </div>
                        <div class="editor-col">
                            <label class="editor-field">
                                <span>Project Description</span>
                                <input type="text" data-field="description">
                            </label>
                            <label class="editor-field">
                                <span>Date End</span>
                                <input type="date" data-field="endDate">
                            </label>
                            <label class="editor-field">
                                <span>Priority Level</span>
                                <input type="text" data-field="priority">
                            </label>
                            <label class="editor-field">
                                <span>Assign to</span>
                                <input type="text" data-field="assignee">
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <button class="add-button" aria-label="Add project or event">+</button>

        <nav class="bottom-nav" aria-label="Main navigation">
            <a href="#" class="nav-item active">
                <span class="nav-icon nav-calendar"></span>
                <span>Schedule</span>
            </a>
            <a href="../page5/Data.html" class="nav-item">
                <img class="nav-icon nav-image nav-data" src="../images/data-icon.png" alt="Data">
                <span>Data</span>
            </a>
            <a href="../page6/Settings.html" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
                <span>Settings</span>
            </a>
        </nav>
    </main>

</body>

</html>
