<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="Dashboard.js"></script>
    <link rel="stylesheet" href="Dashboard.css">
</head>
<body>

    <div class="page">
        <div class="top-bar">
            <h1 class="dashboard-title">Dashboard</h1>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <p class="stat-title">Active projects</p>
                <div class="stat-bottom">
                    <div class="stat-icon folder"></div>
                    <p class="stat-number">0</p>
                </div>
            </div>

            <div class="stat-card">
                <p class="stat-title">Upcoming projects</p>
                <div class="stat-bottom">
                    <div class="stat-icon calendar"></div>
                    <p class="stat-number">0</p>
                </div>
            </div>

            <div class="stat-card">
                <p class="stat-title">Number of Overdue projects</p>
                <div class="stat-bottom">
                    <div class="stat-icon warning"></div>
                    <p class="stat-number">0</p>
                </div>
            </div>

            <div class="stat-card">
                <p class="stat-title">Volunteer hours</p>
                <div class="stat-bottom">
                    <div class="stat-icon clock"></div>
                    <p class="stat-number">0</p>
                </div>
            </div>
        </div>

        <section class="panel active-panel">
            <h2 class="panel-title">Active projects</h2>
            <div class="project-list">
                <div class="project">
                    <div class="project-row">
                        <p>Project number one</p>
                        <p>70%</p>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill progress-seventy"></div>
                    </div>
                </div>

                <div class="project">
                    <div class="project-row">
                        <p>Project number two</p>
                        <p>50%</p>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill progress-fifty"></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="panel event-panel">
            <h2 class="panel-title">Upcoming events</h2>
            <div class="event">
                <div class="date-badge">30 April</div>
                <div>
                    <h3>Event one</h3>
                    <p>School of Science and Technology</p>
                </div>
            </div>
        </section>

        <nav class="bottom-nav" aria-label="Dashboard navigation">
            <a href="#" class="nav-item">
                <span class="nav-icon nav-calendar"></span>
                <span>Schedule</span>
            </a>
            <a href="#" class="nav-item">
                <img
                    class="nav-icon nav-image nav-data"
                    src="https://static.thenounproject.com/png/1731722-200.png"
                    alt=""
                >
                <span>Data</span>
            </a>
            <a href="#" class="nav-item">
                <img
                    class="nav-icon nav-image nav-settings"
                    src="https://static.vecteezy.com/system/resources/previews/026/633/438/non_2x/settings-icon-symbol-design-illustration-vector.jpg"
                    alt=""
                >
                <span>Settings</span>
            </a>
        </nav>

    </div>

</body>
</html>
