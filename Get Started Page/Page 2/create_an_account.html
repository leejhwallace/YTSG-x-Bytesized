<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <link rel="stylesheet" href="create_an_account.css">
            <script src="create_an_account.js"></script>
            <title>Create account</title>
        </head>
    <body>
        <!-- Background circles -->
            <div class="circle circle1"></div>
            <div class="circle circle2"></div>
            <div class="circle circle3"></div>

        <!-- header -->
        <p class="create-account">Create an account</p>
        <p class="personal-info">Fill in your personal information</p>



        <!-- Seperator -->
            <div class="or-wrapper">
                <div class="or-line"></div>
                <div class="or_for_line">OR</div>
                <div class="or-line"></div>
            </div>

        <!--Full name -- email -- password -- confirm-->
            <!-- email -->


            <img class="email-logo" src="https://t3.ftcdn.net/jpg/15/72/21/24/360_F_1572212442_rMh4IfTTPCcjhrwqHUHO5nAZnrdMcvON.jpg" alt="email icon">
            <input type = "text" class = "email-text" name = "email" placeholder="Email">

            <!-- password -->
            <img class="password-logo" src="https://static.thenounproject.com/png/4020631-200.png" alt="password icon">
            <input type = "password" class = "password-text" name = "password" placeholder="Password" autocomplete="off">


    </body>


</html>
