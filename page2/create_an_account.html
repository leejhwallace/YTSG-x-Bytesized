<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="create_an_account.css">
    
    <!-- Supabase config -->
    <script>
        window.SUPABASE_URL = "https://txfditoxxdjigplckjcc.supabase.co";
        window.SUPABASE_ANON_KEY = "sb_publishable_KzdZhuiEyoG6GEVEggJVug_1VtHc6mz";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
    
    <!-- JavaScript file linked with defer to load properly -->
    <script defer src="create_an_account.js"></script>
    <title>Create account</title>
    <link rel="icon" type="image/png" href="../images/web-icon-modified.png">
</head>

<body>
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>

    <p class="create-account">Create an account</p>
    <p class="personal-info">Fill in your personal information</p>

    <div class="or-wrapper">
        <div class="or-line"></div>
        <div class="or_for_line">OR</div>
        <div class="or-line"></div>
    </div>

    <div class="form-container">
        <div class="input-group">
            <img src="https://cdn-icons-png.flaticon.com/512/747/747376.png" class="icon">
            <input id="name-input" class="name-text" type="text" placeholder="Full Name">
        </div>

        <div class="input-group">
            <img class="email-icon" src="https://cdn-icons-png.flaticon.com/512/561/561127.png" alt="email icon">
            <input id="email-input" class="email-text" type="email" placeholder="Email">
        </div>

        <div class="input-group">
            <img class="icon password-icon" src="https://static.thenounproject.com/png/4020631-200.png">
            <input id="password-input" type="password" class="password-text" placeholder="Password">
            <button type="button" class="show-pw"><img class="eye-icon" src="../images/eye-close.png"></button>
        </div>

        <div class="input-group">
            <img class="icon confirm-icon" src="https://static.thenounproject.com/png/4020631-200.png">
            <input id="confirm-password-input" type="password" class="confirm-password-text" placeholder="Confirm Password">
            <button type="button" class="show-pw"><img class="eye-icon" src="../images/eye-close.png"></button>
        </div>
    </div>
    
    <button id="sign-up-button" class="sign-up-rounded-button">SIGN UP</button>

    <p class="have-Account">Already have an account?</p>
    <button id="sign-in-button" class="sign-in-rounded-button" onclick="window.location.href='../page1/Get_Started.html';">SIGN IN</button>

</body>
</html>
