<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="Dashboard.js"></script>
    <link rel="stylesheet" href="Dashboard.css">
</head>

<body>

    <div class="page">
        <div class="top-bar">
            <h1 class="dashboard-title">Dashboard</h1>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <p class="stat-title">Active projects</p>
                <div class="stat-bottom">
                    <div class="stat-icon folder"></div>
                    <p class="stat-number">0</p>
                </div>
            </div>

            <div class="stat-card">
                <p class="stat-title">Upcoming projects</p>
                <div class="stat-bottom">
                    <div class="stat-icon calendar"></div>
                    <p class="stat-number">0</p>
                </div>
            </div>

            <div class="stat-card">
                <p class="stat-title">Number of Overdue projects</p>
                <div class="stat-bottom">
                    <div class="stat-icon warning"></div>
                    <p class="stat-number">0</p>
                </div>
            </div>

            <div class="stat-card">
                <p class="stat-title">Volunteer hours</p>
                <div class="stat-bottom">
                    <div class="stat-icon clock"></div>
                    <p class="stat-number">0</p>
                </div>
            </div>
        </div>

        <section class="panel active-panel">
            <h2 class="panel-title">Active projects</h2>
            <div class="project-list">
                <div class="project">
                    <div class="project-row">
                        <p>Project number one</p>
                        <p>70%</p>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill progress-seventy"></div>
                    </div>
                </div>

                <div class="project">
                    <div class="project-row">
                        <p>Project number two</p>
                        <p>50%</p>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill progress-fifty"></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="panel event-panel">
            <h2 class="panel-title">Upcoming events</h2>
            <div class="event">
                <div class="date-badge">30 April</div>
                <div>
                    <h3>Event one</h3>
                    <p>School of Science and Technology</p>
                </div>
            </div>
        </section>

        <nav class="bottom-nav" aria-label="Dashboard navigation">
            <a href="../page4/Schedule.html" class="nav-item">
                <span class="nav-icon nav-calendar"></span>
                <span>Schedule</span>
            </a>
            <a href="../page5/Data.html" class="nav-item">
                <img class="nav-icon nav-image nav-data" src="../images/data-icon.png" alt="Data">
                <span>Data</span>
            </a>
            <a href="../page6/Settings.html" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                <span>Settings</span>
            </a>
        </nav>

    </div>

</body>

</html>
