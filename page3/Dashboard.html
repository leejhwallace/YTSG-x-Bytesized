<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
    <script src="Dashboard.js"></script>
    <link rel="stylesheet" href="Dashboard.css">
</head>
<body>
    <div class="page">
        <div class="top-bar">
            <h1 class="dashboard-title">Dashboard</h1>
        </div>
        
        <!-- Stats Row Grid (Clickable Category Cards) -->
        <div class="stats-row">
            <div class="stat-card" style="cursor: pointer;" id="cardActive">
                <p class="stat-title">Active projects</p>
                <div class="stat-bottom">
                    <div class="stat-icon folder"></div>
                    <p class="stat-number" id="activeProjectsCount">0</p>
                </div>
            </div>
            <div class="stat-card" style="cursor: pointer;" id="cardUpcoming">
                <p class="stat-title">Upcoming projects</p>
                <div class="stat-bottom">
                    <div class="stat-icon calendar"></div>
                    <p class="stat-number" id="upcomingProjectsCount">0</p>
                </div>
            </div>
            <div class="stat-card" style="cursor: pointer;" id="cardOverdue">
                <p class="stat-title">Number of Overdue projects</p>
                <div class="stat-bottom">
                    <div class="stat-icon warning"></div>
                    <p class="stat-number" id="overdueProjectsCount">0</p>
                </div>
            </div>
            <div class="stat-card" style="cursor: pointer;" id="volunteerHoursCard">
                <p class="stat-title">Volunteer hours (Log+)</p>
                <div class="stat-bottom">
                    <div class="stat-icon clock"></div>
                    <p class="stat-number" id="volunteerHoursCount">0 hrs</p>
                </div>
            </div>
        </div>

        <!-- Current Project Listing Section -->
        <section class="panel active-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 17px 0; border-bottom: 1px solid #c1c6c4;">
                <h2 id="projectListTitle" style="font-size: 20px; font-weight: 800; line-height: 1; padding-bottom: 6px;">Current project listing (Loading...)</h2>
                <button id="resetFilterBtn" style="display: none; padding: 2px 10px; background: #000; color: #fff; border: none; border-radius: 4px; font-weight: 700; cursor: pointer; font-size: 11px; margin-bottom: 6px;">Show All Assigned</button>
            </div>
            <div class="project-list" id="prioritizedProjectList">
                <!-- Project cards display here dynamically -->
            </div>
        </section>

        <!-- Upcoming Events Separate Section -->
        <section class="panel event-panel">
            <h2 class="panel-title">Upcoming events</h2>
            <div id="upcomingEventsList">
                <!-- Actual events loaded from backend pull here -->
            </div>
        </section>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav" aria-label="Dashboard navigation">
            <a href="../page4/Schedule.html" class="nav-item">
                <span class="nav-icon nav-calendar"></span>
                <span>Schedule</span>
            </a>
            <a href="../page5/Data.html" class="nav-item">
                <img class="nav-icon nav-image nav-data" src="../images/data-icon.png" alt="Data">
                <span>Data</span>
            </a>
            <a href="../page6/Settings.html" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                <span>Settings</span>
            </a>
        </nav>
    </div>

    <!-- Log Volunteer Hours Modal Overlay -->
    <div id="hoursModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:10000; place-items:center; padding:20px;">
        <div style="background:#fff; padding:24px; border-radius:12px; width:100%; max-width:400px; box-shadow:0 4px 20px rgba(0,0,0,0.2);">
            <h3 style="margin-bottom:12px; font-weight:800;">Log Project Hours</h3>
            
            <label style="display:block; margin-bottom:12px; font-weight:600; font-size:14px;">
                Select Project:
                <select id="modalResourceDropdown" style="width:100%; padding:8px; margin-top:6px; border:1px solid #ccc; border-radius:6px;">
                    <!-- Project lists populate dynamically here -->
                </select>
            </label>

            <label style="display:block; margin-bottom:12px; font-weight:600; font-size:14px;">
                Hours Contributed:
                <input type="number" id="modalHoursInput" min="0.1" step="0.1" placeholder="e.g. 3.5" style="width:100%; padding:8px; margin-top:6px; border:1px solid #ccc; border-radius:6px; outline:none;">
            </label>

            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button id="closeHoursModal" style="padding:8px 16px; border:none; background:#ccc; border-radius:6px; cursor:pointer; font-weight:700;">Cancel</button>
                <button id="saveHoursBtn" style="padding:8px 16px; border:none; background:#efb247; color:#fff; border-radius:6px; cursor:pointer; font-weight:700;">Save Entry</button>
            </div>
        </div>
    </div>
</body>
</html>
